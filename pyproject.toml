[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memuaq"
version = "0.1.0"
description = "Experiments for agent memory in reliable unanswerable-question handling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "openai>=1.30",
  "PyYAML>=6.0",
  "requests>=2.31",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
memuaq = "memuaq.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
